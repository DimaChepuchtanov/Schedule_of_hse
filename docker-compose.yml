name: schedule-hse-dev

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${PG_DATABASE:-schedule_hse}
      POSTGRES_USER: ${PG_USER:-schedule_hse}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?Set PG_PASSWORD in the environment file}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  db-init:
    image: postgres:16-alpine

    depends_on:
      db:
        condition: service_healthy

    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${PG_USER:-schedule_hse}
      PGPASSWORD: ${PG_PASSWORD:?Set PG_PASSWORD in the environment file}
      PGDATABASE: ${PG_DATABASE:-schedule_hse}

    volumes:
      - ./scripts/create_schemas.sql:/scripts/create_schemas.sql:ro

    command:
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -f
      - /scripts/create_schemas.sql

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend

    init: true

    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"

    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

    env_file:
      - .env

    environment:
      DJANGO_SETTINGS_MODULE: project_manage.settings.dev
      PG_HOST: db
      PG_PORT: "5432"

    command:
      - /bin/sh
      - -c
      - >-
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput &&
        exec gunicorn project_manage.wsgi:application
        --bind 0.0.0.0:8000 
        --worker-class gthread
        --workers 1
        --threads 4
        --access-logfile -
        --error-logfile -
        --reload
      


volumes:
  postgres_data: {}
