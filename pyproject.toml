[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "schedule-hse"
version = "0.1.0"
description = "University timetable generation and management system"
requires-python = ">=3.12"
dependencies = [
    "asgiref==3.13.0",
    "Django==6.1.2",
    "dotenv==0.9.9",
    "python-dotenv==1.2.4",
    "sqlparse==0.6.0",
    "tzdata==2026.5",
    "psycopg[binary]==3.3.6",
    "djangorestframework==3.18.0",
    "drf-spectacular==0.30.0",
    "gunicorn",
    "whitenoise",
]

[dependency-groups]
lint = ["ruff==0.17.4"]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["frontend*", "scripts*"]
namespaces = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["staticfiles", "media"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
