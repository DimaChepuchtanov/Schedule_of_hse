name: Lint

on:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.10"

      - name: Install Ruff
        run: |
          python -m pip install --upgrade "pip>=25.1"
          python -m pip install --group lint

      - name: Check changed Python files
        shell: bash
        run: |
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --name-only --diff-filter=ACMR -z HEAD^ HEAD \
              -- '*.py' '*.pyi' > "$RUNNER_TEMP/python-files"
          else
            git diff-tree --root --no-commit-id --name-only \
              --diff-filter=ACMR -r -z HEAD \
              -- '*.py' '*.pyi' > "$RUNNER_TEMP/python-files"
          fi

          mapfile -d '' -t files < "$RUNNER_TEMP/python-files"

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Python files changed."
            exit 0
          fi

          python -m ruff check --no-fix --force-exclude \
            --output-format=github -- "${files[@]}"